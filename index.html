<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>الراقی — روحانی شفاء و رابطہ</title>
  <meta name="theme-color" content="#065f46" />
  <meta name="description" content="مریض اور سائل کے لیے الراقی کی محفوظ، تیز اور 100 فیصد مفت ایپ" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, #022c22 0%, #065f46 60%, #047857 100%);
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, sans-serif;
    }
    #splashWrap {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      padding: 18px; text-align: center; z-index: 10;
    }
    .box {
      max-width: 390px; width: 100%;
      background: rgba(255,255,255,0.09); border: 2px solid #34d399;
      border-radius: 22px; padding: 24px 18px;
    }
    .box img { width: 96px; height: 96px; border-radius: 18px; background: #fff; padding: 4px; border: 3px solid #34d399; }
    .box h1 { margin: 10px 0 6px; font-size: 1.9rem; }
    .box p { margin: 0 0 12px; color: #a7f3d0; font-size: 0.92rem; }
    #appFrame {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      border: none; display: none; z-index: 20;
      background: #f0fdf4;
    }
  </style>
</head>
<body>
  <div id="splashWrap">
    <div class="box">
      <img src="icon-192.png" alt="الراقی" />
      <h1>الراقی</h1>
      <p id="st">⏳ آپ کا محفوظ پورٹل لوڈ ہو رہا ہے...</p>
    </div>
  </div>
  <iframe id="appFrame" title="الراقی" allow="microphone; autoplay; clipboard-write"></iframe>

  <script>
    (function() {
      var API = 'https://script.google.com/macros/s/AKfycbzKlQ08MZlyKir8IvIZkqLrych04BuJYseRe2_Bb2xcDTu39qfguH4rmqFdqqc9Fkgl7g/exec';
      var params = new URLSearchParams(window.location.search);
      var m = params.get('m') || params.get('mualij') || localStorage.getItem('alraqi_patient_mualij_v1') || '';
      if (m) { try { localStorage.setItem('alraqi_patient_mualij_v1', m); } catch (e) {} }

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(function() {});
      }

      var deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        deferredPrompt = e;
      });

      window.addEventListener('message', function(ev) {
        if (ev && ev.data && ev.data.type === 'ALRAQI_INSTALL_APP') {
          if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.finally(function() { deferredPrompt = null; });
          } else {
            alert('موبائل یا کمپیوٹر میں انسٹال کرنے کے لیے براؤزر کے اوپر والے ایڈریس بار یا مینو (⋮) سے "Install app" منتخب کریں۔');
          }
        }
      });

      fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'get_patient_lite_html_v150', mualij: m })
      })
      .then(function(r) { return r.json(); })
      .then(function(res) {
        if (res && res.ok && res.html) {
          var frame = document.getElementById('appFrame');
          var splash = document.getElementById('splashWrap');
          frame.srcdoc = res.html;
          frame.style.display = 'block';
          if (splash) splash.style.display = 'none';
        } else {
          document.getElementById('st').textContent = '⚠️ لوڈنگ میں تاخیر، دوبارہ ریفریش کریں۔';
        }
      })
      .catch(function() {
        document.getElementById('st').textContent = '⚠️ انٹرنیٹ کنکشن چیک کریں۔';
      });
    })();
  </script>
</body>
</html>
