          instIosDesc: 'للتثبيت على آيفون، اضغط زر <b>المشاركة (⬆️)</b> في الأسفل ثم اختر <b>Add to Home Screen</b>.',
          instFallbackDesc: 'للتثبيت، افتح قائمة المتصفح <b>(⋮)</b> بالأعلى واختر <b>Install app</b> أو <b>Add to Home screen</b>.',
          instBtn: '📲 تثبيت الآن',

          manifest: './manifest-ar.json?v=6'
        },
        'en-GB': {
          dir: 'ltr', title: 'Al-Raqi', sub: 'Ruqyah Shariah & Spiritual Guidance Centre',
          loading: '⏳ Loading...', retry: '⚠️ Loading delayed, please refresh.',
          netErr: '⚠️ Please check your internet connection and try again.',
          installTip: 'To install on mobile or laptop, open the browser menu (⋮) and choose "Install app".',
          instTitle: '📲 Install Al-Raqi App',
          instSub: 'Install first for quick one-tap access on your Home Screen',
          instNativeDesc: 'Add Al-Raqi to your Home Screen so you can open it anytime in one tap without looking for the link again.',
          instInAppDesc: 'This link opened inside WhatsApp/an in-app browser. Tap <b>⋮</b> at the top corner and choose <b>Open in Chrome</b> to install.',
          instIosDesc: 'To install on iPhone/iPad, tap the <b>Share (⬆️)</b> button below and select <b>Add to Home Screen</b>.',
          instFallbackDesc: 'To install, open your browser menu <b>(⋮)</b> at the top and choose <b>Install app</b> or <b>Add to Home screen</b>.',
          instBtn: '📲 Install Now',
          instGotIt: 'Got it',
          instLater: 'Later / Continue',
          instInstalling: '✅ Installing...',
          manifest: './manifest-en-gb.json?v=6'
        },
        'en-US': {
          dir: 'ltr', title: 'Al-Raqi', sub: 'Ruqyah Shariah & Spiritual Guidance Center',
          loading: '⏳ Loading...', retry: '⚠️ Loading delayed, please refresh.',
          netErr: '⚠️ Please check your internet connection and try again.',
          installTip: 'To install on mobile or laptop, open the browser menu (⋮) and choose "Install app".',
          instTitle: '📲 Install Al-Raqi App',
          instSub: 'Install first for quick one-tap access on your Home Screen',
          instNativeDesc: 'Add Al-Raqi to your Home Screen so you can open it anytime in one tap without searching for the link again.',
          instInAppDesc: 'This link opened inside WhatsApp/an in-app browser. Tap <b>⋮</b> at the top corner and choose <b>Open in Chrome</b> to install.',
          instIosDesc: 'To install on iPhone/iPad, tap the <b>Share (⬆️)</b> button below and select <b>Add to Home Screen</b>.',
          instFallbackDesc: 'To install, open your browser menu <b>(⋮)</b> at the top and choose <b>Install app</b> or <b>Add to Home screen</b>.',
          instBtn: '📲 Install Now',
          instGotIt: 'Got it',
          instLater: 'Later / Continue',
          instInstalling: '✅ Installing...',
          manifest: './manifest-en-us.json?v=6'
        }
      };

      var ARAB_CC = ['SA','AE','QA','KW','OM','BH','EG','JO','IQ','YE','SY','LB','PS','SD','LY','TN','DZ','MA','MR','SO','DJ','KM'];
      var UK_CC = ['GB','UK','AU','NZ','IE','ZA','SG','MY','HK','MT','CY'];
      var US_CC = ['US','CA','PH','PR'];
      var UR_CC = ['PK','IN'];

      function mapCountryToLang(cc) {
        cc = String(cc || '').toUpperCase().trim();
        if (UR_CC.indexOf(cc) !== -1) return 'ur';
        if (ARAB_CC.indexOf(cc) !== -1) return 'ar';
        if (UK_CC.indexOf(cc) !== -1) return 'en-GB';
        if (US_CC.indexOf(cc) !== -1) return 'en-US';
        return 'en-GB';
      }

      function detectFastLang() {
        try {
          var q = new URLSearchParams(window.location.search).get('lang');
          if (q && ['ur','ar','en-GB','en-US'].indexOf(q) !== -1) return q;
          var saved = localStorage.getItem('ALRAQI_LANG_V1');
          if (saved && ['ur','ar','en-GB','en-US'].indexOf(saved) !== -1) return saved;
        } catch (e) {}
        try {
          var tz = (Intl.DateTimeFormat().resolvedOptions().timeZone || '').toLowerCase();
          if (tz.indexOf('karachi') !== -1 || tz.indexOf('kolkata') !== -1) return 'ur';
          if (tz.indexOf('riyadh') !== -1 || tz.indexOf('dubai') !== -1 || tz.indexOf('qatar') !== -1 || tz.indexOf('kuwait') !== -1 || tz.indexOf('cairo') !== -1 || tz.indexOf('amman') !== -1 || tz.indexOf('baghdad') !== -1 || tz.indexOf('muscat') !== -1 || tz.indexOf('bahrain') !== -1) return 'ar';
          if (tz.indexOf('london') !== -1 || tz.indexOf('sydney') !== -1 || tz.indexOf('melbourne') !== -1 || tz.indexOf('auckland') !== -1 || tz.indexOf('dublin') !== -1) return 'en-GB';
          if (tz.indexOf('america/') !== -1 || tz.indexOf('new_york') !== -1 || tz.indexOf('chicago') !== -1 || tz.indexOf('los_angeles') !== -1 || tz.indexOf('toronto') !== -1) return 'en-US';
        } catch (e) {}
        var nav = (navigator.language || 'ur').toLowerCase();
        if (nav.indexOf('ar') === 0) return 'ar';
        if (nav.indexOf('ur') === 0) return 'ur';
        if (nav === 'en-us' || nav === 'en-ca') return 'en-US';
        if (nav.indexOf('en') === 0) return 'en-GB';
        return 'ur';
      }

      function detectCountryGeoAsync(cb) {
        try {
          if (localStorage.getItem('ALRAQI_LANG_MANUAL_V1') === '1') return;
        } catch (e) {}
        var done = false;
        var timer = setTimeout(function() { done = true; }, 2200);
        fetch('https://ipapi.co/country/', { cache: 'no-store' })
          .then(function(r) { return r.ok ? r.text() : ''; })
          .then(function(cc) {
            if (done) return;
            clearTimeout(timer);
            cc = String(cc || '').trim();
            if (cc.length === 2) {
              var lang = mapCountryToLang(cc);
              try { localStorage.setItem('ALRAQI_LANG_V1', lang); } catch (e) {}
              cb(lang);
            }
          }).catch(function() {});
      }

      var activeLang = detectFastLang();
      var deferredPrompt = null;
      var installMode = 'fallback'; // 'native' | 'inapp' | 'ios' | 'fallback'

      function isStandaloneInstalled() {
        try {
          if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return true;
          if (window.navigator && window.navigator.standalone === true) return true;
          if (document.referrer && document.referrer.indexOf('android-app://') === 0) return true;
        } catch (e) {}
        return false;
      }

      function detectEnvMode() {
        if (deferredPrompt) return 'native';
        var ua = navigator.userAgent || '';
        if (/WhatsApp|FBAN|FBAV|Instagram|Line|Snapchat|Twitter|MicroMessenger/i.test(ua)) return 'inapp';
        if (/iPhone|iPad|iPod/i.test(ua) && !/CriOS|FxiOS/i.test(ua)) return 'ios';
        return 'fallback';
      }

      function renderInstallModalText() {
        var t = SPLASH_I18N[activeLang] || SPLASH_I18N.ur;
        var elTitle = document.getElementById('instTitle');
        var elSub = document.getElementById('instSub');
        var elDesc = document.getElementById('instDesc');
        var elPrimary = document.getElementById('instPrimaryBtn');
        var elLater = document.getElementById('instLaterBtn');
        if (!elTitle) return;
        elTitle.textContent = t.instTitle;
        elSub.textContent = t.instSub;
        elLater.textContent = t.instLater;
        if (installMode === 'native') {
          elDesc.innerHTML = t.instNativeDesc;
          elPrimary.textContent = t.instBtn;
          elPrimary.style.display = 'block';
        } else if (installMode === 'inapp') {
          elDesc.innerHTML = t.instInAppDesc;
          elPrimary.textContent = t.instGotIt;
          elPrimary.style.display = 'block';
        } else if (installMode === 'ios') {
          elDesc.innerHTML = t.instIosDesc;
          elPrimary.textContent = t.instGotIt;
          elPrimary.style.display = 'block';
        } else {
          elDesc.innerHTML = t.instFallbackDesc;
          elPrimary.textContent = t.instGotIt;
          elPrimary.style.display = 'block';
        }
      }

      function showInstallPopup(forceShow) {
        if (isStandaloneInstalled()) return;
        try {
          if (!forceShow && sessionStorage.getItem('ALRAQI_INSTALL_DISMISSED') === '1') return;
        } catch (e) {}
        installMode = detectEnvMode();
        renderInstallModalText();
        var bd = document.getElementById('installBackdrop');
        if (bd) bd.style.display = 'flex';
      }

      function hideInstallPopup(markDismissed) {
        var bd = document.getElementById('installBackdrop');
        if (bd) bd.style.display = 'none';
        if (markDismissed) {
          try { sessionStorage.setItem('ALRAQI_INSTALL_DISMISSED', '1'); } catch (e) {}
        }
      }

      function applySplashLang(lang) {
        activeLang = SPLASH_I18N[lang] ? lang : 'ur';
        var t = SPLASH_I18N[activeLang];
        document.documentElement.lang = activeLang;
        document.documentElement.dir = t.dir;
        document.title = t.title + ' — ' + t.sub;
        var elT = document.getElementById('spTitle');
        var elS = document.getElementById('spSub');
        var elSt = document.getElementById('st');
        var mf = document.getElementById('dynManifest');
        if (elT) elT.textContent = t.title;
        if (elS) elS.textContent = t.sub;
        if (elSt && elSt.textContent.indexOf('⏳') === 0) elSt.textContent = t.loading;
        if (mf) mf.setAttribute('href', t.manifest);
        renderInstallModalText();
      }
      applySplashLang(activeLang);
      detectCountryGeoAsync(function(geoLang) {
        applySplashLang(geoLang);
        try {
          var fr = document.getElementById('appFrame');
          if (fr && fr.contentWindow) fr.contentWindow.postMessage({ type: 'ALRAQI_SET_LANG', lang: geoLang }, '*');
        } catch (e) {}
      });

      // Wire popup buttons
      var primaryBtn = document.getElementById('instPrimaryBtn');
      var laterBtn = document.getElementById('instLaterBtn');
      if (primaryBtn) {
        primaryBtn.addEventListener('click', function() {
          if (deferredPrompt) {
            var t = SPLASH_I18N[activeLang] || SPLASH_I18N.ur;
            primaryBtn.textContent = t.instInstalling;
            primaryBtn.disabled = true;
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then(function(choice) {
              deferredPrompt = null;
              primaryBtn.disabled = false;
              if (choice && choice.outcome === 'accepted') {
                hideInstallPopup(true);
              } else {
                hideInstallPopup(true);
              }
            }).catch(function() {
              deferredPrompt = null;
              primaryBtn.disabled = false;
              hideInstallPopup(true);
            });
          } else {
            hideInstallPopup(true);
          }
        });
      }
      if (laterBtn) {
        laterBtn.addEventListener('click', function() { hideInstallPopup(true); });
      }

      var params = new URLSearchParams(window.location.search);
      var m = params.get('m') || params.get('mualij') || localStorage.getItem('alraqi_patient_mualij_v1') || '';
      if (m) { try { localStorage.setItem('alraqi_patient_mualij_v1', m); } catch (e) {} }
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js?v=5').then(function(reg) {
          try { reg.update(); } catch (e) {}
        }).catch(function() {});
      }

      // Immediately capture native install prompt and show 1-tap popup
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        deferredPrompt = e;
        showInstallPopup(false);
      });
      window.addEventListener('appinstalled', function() {
        deferredPrompt = null;
        hideInstallPopup(true);
      });

      // Fallback auto-popup for WhatsApp in-app browser, iOS Safari, or browsers without beforeinstallprompt
      if (!isStandaloneInstalled()) {
        setTimeout(function() {
          var bd = document.getElementById('installBackdrop');
          if (bd && bd.style.display !== 'flex') {
            showInstallPopup(false);
          }
        }, 2200);
      }

      window.addEventListener('message', function(ev) {
        if (!ev || !ev.data) return;
        if (ev.data.type === 'ALRAQI_INSTALL_APP') {
          if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.finally(function() { deferredPrompt = null; hideInstallPopup(true); });
          } else {
            showInstallPopup(true);
          }
        } else if (ev.data.type === 'ALRAQI_LANG_CHANGED' && ev.data.lang) {
          try {
            localStorage.setItem('ALRAQI_LANG_V1', ev.data.lang);
            localStorage.setItem('ALRAQI_LANG_MANUAL_V1', '1');
          } catch (e) {}
          applySplashLang(ev.data.lang);
        }
      });

      fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'get_patient_lite_html_v150', mualij: m })
      })
      .then(function(r) { return r.json(); })
      .then(function(res) {
        if (res && res.ok && res.html) {
          var frame = document.getElementById('appFrame');
          var splash = document.getElementById('splashWrap');
          frame.onload = function() {
            try { frame.contentWindow.postMessage({ type: 'ALRAQI_SET_LANG', lang: activeLang }, '*'); } catch (e) {}
          };
          frame.srcdoc = res.html;
          frame.style.display = 'block';
          if (splash) splash.style.display = 'none';
        } else {
          document.getElementById('st').textContent = (SPLASH_I18N[activeLang] || SPLASH_I18N.ur).retry;
        }
      })
      .catch(function() {
        document.getElementById('st').textContent = (SPLASH_I18N[activeLang] || SPLASH_I18N.ur).netErr;
      });
    })();
  </script>
</body>
</html>
